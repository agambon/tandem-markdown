# The core checks, on every push to main and every pull request: the formatting, the lint, the
# types, the core unit tests (the simulation's default seeds and the merge oracle's seeded run
# among them) and the two generated files. CONTRIBUTING.md, "Where each check runs", says why these
# and no others; area.yml and release.yml run the rest.
name: Core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Format, lint, types, core unit tests and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:core
      - name: Third-party notices match the build
        run: node scripts/third-party.mjs --check
      - name: Syntax reference matches the code
        run: node scripts/syntax-reference.mjs --check
